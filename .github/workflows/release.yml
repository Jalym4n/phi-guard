name: Release builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install ".[studio]" pyinstaller
      # Text recognition for scanned documents. Windows builds bundle Tesseract (Apache-2.0) with
      # English and French data so clinics don't install anything else. macOS and Linux builds use a
      # system Tesseract (brew / apt); Studio explains how to add it if it's missing.
      - name: Install Tesseract (Windows, to bundle)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest -Uri https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata -OutFile "$tessdata\fra.traineddata"
      - name: Install Tesseract (macOS, for the smoke test)
        if: runner.os == 'macOS'
        run: brew install tesseract tesseract-lang
      - name: Install Tesseract (Linux, for the smoke test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
      - name: Build UI, freeze with PyInstaller, smoke-test, zip (Windows, bundling Tesseract)
        if: runner.os == 'Windows'
        run: python packaging/build.py --bundle-tesseract "C:\Program Files\Tesseract-OCR"
      - name: Build UI, freeze with PyInstaller, smoke-test, zip
        if: runner.os != 'Windows'
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: phi-guard-studio-${{ matrix.os }}
          path: dist/phi-guard-studio-*.zip
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t phi-guard-studio:${{ github.ref_name }} .
      - run: docker save phi-guard-studio:${{ github.ref_name }} | gzip > phi-guard-studio-docker.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: phi-guard-studio-docker
          path: phi-guard-studio-docker.tar.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
