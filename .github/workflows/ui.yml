name: Studio UI and E2E
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: studio-ui
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production dependencies have no known high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json
      - run: pip install -e ".[studio]"
        working-directory: .
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (axe, light and dark)
        run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: studio-ui/test-results
