[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "phi-guard"
dynamic = ["version"]
description = "Redact patient data and screen for prompt injection before text reaches an AI model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jaleed Ahmad" }]
keywords = ["phi", "pii", "redaction", "prompt-injection", "healthcare", "privacy", "llm-security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Intended Audience :: Healthcare Industry",
]
dependencies = []

[project.optional-dependencies]
docs = ["python-docx>=1.1", "pypdf>=4.3"]
ner = ["spacy>=3.7,<4"]
studio = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pypdf>=4.3",
    "keyring>=25",
    "cryptography>=43",
    "platformdirs>=4",
]
eval = ["faker>=26", "matplotlib>=3.8", "python-docx>=1.1", "pypdf>=4.3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "reportlab>=4.2",
    "pip-audit>=2.7",
]

[project.scripts]
phi-guard = "phi_guard.cli:main"
phi-guard-studio = "phi_guard_studio.launcher:main"

[tool.hatch.version]
path = "src/phi_guard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/phi_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
files = ["src/phi_guard"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["docx.*", "pypdf.*", "spacy.*", "keyring.*", "presidio_analyzer.*", "faker.*", "matplotlib.*", "reportlab.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["phi_guard", "phi_guard_studio"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
