[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "phi-guard"
dynamic = ["version"]
description = "Redact patient data and screen for prompt injection before text reaches an AI model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jaleed Ahmad" }]
keywords = ["phi", "pii", "redaction", "prompt-injection", "healthcare", "privacy", "llm-security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Intended Audience :: Healthcare Industry",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
phi-guard = "phi_guard.cli:main"

[tool.hatch.version]
path = "src/phi_guard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/phi_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
